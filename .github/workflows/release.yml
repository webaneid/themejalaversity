name: Release Theme

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.2.0) for manual release'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Clean Theme ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist --no-progress

      - name: Build Production CSS
        run: npm run build

      - name: Run Quality Gates
        run: |
          composer lint
          composer analyse
          composer css:check
          composer dist:check

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Version in style.css and functions.php
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i -E "s/^(Version:[[:space:]]*).*/\1${VERSION}/" style.css
          sed -i -E "s/(define\([[:space:]]*'JALAVERSITY_VERSION',[[:space:]]*')[^']+(')/\1${VERSION}\2/" functions.php

      - name: Build Clean Release Package
        run: |
          mkdir -p build/jalaversity
          rsync -a --exclude-from=.distignore ./ build/jalaversity/
          cd build
          zip -r ../jalaversity.zip jalaversity/
          zip -r "../jalaversity-${{ steps.version.outputs.version }}.zip" jalaversity/

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jalaversity ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            jalaversity.zip
            jalaversity-${{ steps.version.outputs.version }}.zip
